<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Formulário Interativo</title>
</head>
<body>
    <section class="containerPai">
        <div class="card cadastroActive">
            <div class="esquerda">
                <div class="FormLogin">
                    <h2>Fazer Login</h2>
                    <form>
                        <input type="text" placeholder="E-mail">
                        <input type="password" placeholder="Senha">
                        <button type="submit">Entrar</button>
                    </form>
                </div>
               <div class="facaLogin">
             <h2>Já tem <br>uma conta?</h2>
                <p>Entre na sua conta e aproveite. </p navegar na plataforma.</p>
                    <button class="loginButton">Faça login</button>
               </div>
            </div>
            <div class="direita">
                <div class="FormCadastro">
                    <h2>Cadastre-se</h2>
                    <form>
                        <input type="text" placeholder="Nome">
                         <input type="email" placeholder="E-mail">
                          <input type="password" placeholder="Senha">
                           <input type="password" placeholder="Confirme a sua senha">
                          <button type="submit">Cadastrar</button>
                    </form>
                </div>
                <div class="FacaCadastro">
                    <h2>Não tem <br>uma conta?</h2>
                    <p>Lorem Ipsum has been the industry's standard dummy text
                        ever since the 1500s</p>
                 <button class="cadastroButton">Cadastre-se</button>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
